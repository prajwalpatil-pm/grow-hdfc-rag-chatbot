[project]
name = "mf-faq-rag"
version = "0.1.0"
description = "Facts-only RAG chatbot for HDFC mutual-fund scheme FAQs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"ui/streamlit_app.py" = ["E402"]  # sys.path bootstrap must precede app imports
